<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quelle IA est la plus utilisée dans chaque pays d'Europe ? (démo de la carte)</title>
  <!-- Thème : ?theme=dark ou ?theme=light dans l'adresse (sinon réglage du système) -->
  <script>
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="carte-europe.css">
  <style>
    /* Mise en page de la démo seulement (sur le site : css/style.css) */
    body {
      margin: 0;
      background: var(--surface-2);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: var(--fs-body);
      line-height: 1.5;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: var(--gap-xl) var(--gap-md);
    }
    h1 {
      margin: 0 0 var(--gap-sm);
      font-size: clamp(26px, 3.6vw, 40px);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }
    .intro {
      max-width: 62ch;
      margin: 0 0 var(--gap-lg);
      color: var(--ink-2);
    }
    .theme {
      margin: 0 0 var(--gap-md);
      padding: 6px 12px;
      border: 1px solid var(--axis);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    .theme:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    @media (max-width: 480px) {
      main { padding: var(--gap-lg) 12px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Quelle IA est la plus utilisée dans chaque pays d'Europe&nbsp;?</h1>
    <p class="intro">Chaque pays prend la couleur de l'IA conversationnelle qui a envoyé le plus de visites vers des sites web en octobre 2026, d'après StatCounter. Survolez ou touchez un pays pour voir la répartition complète.</p>
    <button type="button" class="theme" id="theme">Passer en thème sombre</button>

    <div class="dv-carte" data-dataviz="carte-europe"></div>
  </main>

  <script src="../../vendor/d3.min.js"></script>
  <!-- Fond de carte (facultatif) : sans ce fichier, la carte le télécharge sur jsDelivr -->
  <script src="../../vendor/world-50m.js"></script>
  <script src="data-usage.js"></script>
  <script src="carte-europe.js"></script>
  <script>
    (function () {
      var b = document.getElementById('theme');
      var root = document.documentElement;
      function sombre() {
        var t = root.getAttribute('data-theme');
        if (t) return t === 'dark';
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }
      function maj() { b.textContent = sombre() ? 'Passer en thème clair' : 'Passer en thème sombre'; }
      b.addEventListener('click', function () {
        root.setAttribute('data-theme', sombre() ? 'light' : 'dark');
        maj();
      });
      maj();
    })();
  </script>
</body>
</html>
